name: Images

# Build completo das imagens de cartao (Buildroot). Nao roda em PR por padrao:
# cada aparelho leva 1-3 h em runner de 4 vCPU.
on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Aparelhos separados por espaco, ou 'all'. Vazio = x55"
        required: false
        default: "x55"
      fallback_dts:
        description: "Permitir DTS de fallback (imagens de TESTE)"
        type: boolean
        default: false
      buildroot_ref:
        description: "Tag/branch do Buildroot LTS"
        required: false
        default: "2024.02.x"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  matrix:
    name: matriz de aparelhos
    runs-on: ubuntu-24.04
    outputs:
      devices: ${{ steps.list.outputs.devices }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          set -eu
          requested="${{ github.event.inputs.devices }}"
          # Release sem input: so o aparelho validado em hardware.
          if [ -z "$requested" ]; then
            requested="x55"
          fi
          if [ "$requested" = "all" ]; then
            requested=$(tools/build-image.sh --list | tr '\n' ' ')
          fi
          json=$(printf '%s\n' $requested | sort -u | \
                 python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "devices=$json" >> "$GITHUB_OUTPUT"
          echo "aparelhos: $json"

  build:
    name: imagem ${{ matrix.device }}
    needs: matrix
    if: needs.matrix.outputs.devices != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: ${{ fromJSON(needs.matrix.outputs.devices) }}

    steps:
      - uses: actions/checkout@v4

      # O runner ubuntu-24.04 vem com ~14 GB livres no /home/runner, e um build
      # completo do Buildroot passa disso (toolchain + kernel + U-Boot +
      # openssl + mesa3d). Sem liberar espaco o job MORRE NO MEIO, sem mensagem:
      # o log simplesmente termina numa linha de compilacao e os passos de
      # limpeza nem rodam. Foi exatamente o que aconteceu na run 40617882645
      # (69 min compilando, morreu durante o openssl).
      - name: Liberar espaco em disco
        run: |
          set -eu
          echo "antes:"; df -h / /home/runner 2>/dev/null | sed 's/^/  /'
          # SDKs pre-instalados que este build nao usa. Recupera ~20-25 GB.
          sudo rm -rf             /usr/share/dotnet             /usr/local/lib/android             /opt/ghc             /opt/hostedtoolcache             /usr/local/share/boost             /usr/share/swift             /usr/lib/jvm             /usr/local/.ghcup             /opt/az             /usr/local/julia*             2>/dev/null || true
          sudo apt-get clean
          echo "depois:"; df -h / /home/runner 2>/dev/null | sed 's/^/  /'

      - name: Dependencias de build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git wget curl cpio unzip rsync bc file \
            libncurses-dev python3 python3-setuptools python3-pip \
            dosfstools mtools e2fsprogs device-tree-compiler bison flex \
            libssl-dev libelf-dev python3-pil

      # So o cache de DOWNLOADS. O ccache foi removido: ele guarda uma copia de
      # cada objeto (GBs) e a chave ja e invalidada por hashFiles('buildroot/**'),
      # entao o ganho entre builds e pequeno para o custo de disco.
      - name: Cache dos downloads do Buildroot
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/buildroot-dl
          key: br-${{ matrix.device }}-${{ github.event.inputs.buildroot_ref || 'release' }}-${{ hashFiles('buildroot/**') }}
          restore-keys: |
            br-${{ matrix.device }}-
            br-

      - name: Baixar Buildroot
        run: |
          set -eu
          ref="${{ github.event.inputs.buildroot_ref || '2024.02.x' }}"
          git clone --depth 1 --branch "$ref" \
            https://github.com/buildroot/buildroot.git "$RUNNER_TEMP/buildroot"
          echo "BUILDROOT_DIR=$RUNNER_TEMP/buildroot" >> "$GITHUB_ENV"
          mkdir -p .cache/buildroot-dl
          echo "BR2_DL_DIR=$GITHUB_WORKSPACE/.cache/buildroot-dl" >> "$GITHUB_ENV"

      - name: Validar simbolos dos defconfigs
        run: |
          # Kconfig descarta em silencio simbolos inexistentes e aborta com
          # BR2_LEGACY sem dizer qual simbolo e o culpado. Falhar aqui da o
          # nome do simbolo antes de gastar 1-3 h de build.
          tools/check-buildroot-symbols.py --buildroot "$BUILDROOT_DIR"

      - name: DTS externo (quando o aparelho exigir)
        run: |
          set -eu
          # DTS de terceiros NAO ficam no repositorio. Para X35S/X35H, ou o
          # mantenedor adiciona o arquivo, ou o build usa --fallback-dts.
          if [ -d buildroot/board/giochi/dts ]; then
            ls -l buildroot/board/giochi/dts || true
          fi

      - name: Regenerar assets de bootsplash
        run: |
          set -eu
          make bootlogo
          python3 -m unittest tests.test_bootlogo -v

      - name: Preflight
        run: |
          args="${{ matrix.device }}"
          if [ "${{ github.event.inputs.fallback_dts }}" = "true" ]; then
            args="$args --fallback-dts"
          fi
          tools/build-image.sh --check $args

      - name: Build da imagem
        run: |
          args="${{ matrix.device }}"
          if [ "${{ github.event.inputs.fallback_dts }}" = "true" ]; then
            args="$args --fallback-dts"
          fi
          tools/build-image.sh $args --jobs "$(nproc)"

      - name: Tamanho e checksum
        run: |
          set -eu
          base="dist/${{ matrix.device }}/giochi-${{ matrix.device }}-sdcard.img"
          test -f "$base"
          # O .img cru tem ~920 MB, quase todo zero. O artefato publicado e o
          # comprimido (~40-90 MB); balenaEtcher e Raspberry Pi Imager abrem
          # .xz/.gz direto. Falhar se o comprimido nao sair evita publicar
          # 900 MB por engano.
          packed=""
          for ext in xz zst gz; do
            [ -f "$base.$ext" ] && { packed="$base.$ext"; break; }
          done
          if [ -z "$packed" ]; then
            echo "ERRO: nenhum artefato comprimido (.xz/.zst/.gz) em dist" >&2
            ls -lh dist/${{ matrix.device }} >&2
            exit 1
          fi
          echo "cru:";       ls -lh "$base"
          echo "publicado:"; ls -lh "$packed"
          ( cd "$(dirname "$base")" && sha256sum "$(basename "$packed")" \
              > "$(basename "$packed").sha256" && cat "$(basename "$packed").sha256" )

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: giochi-${{ matrix.device }}
          # So o comprimido + checksums: o .img cru estoura o limite pratico
          # de armazenamento/transferencia e nao agrega nada ao usuario.
          path: |
            dist/${{ matrix.device }}/*.img.xz
            dist/${{ matrix.device }}/*.img.zst
            dist/${{ matrix.device }}/*.img.gz
            dist/${{ matrix.device }}/*.sha256
          if-no-files-found: error
          retention-days: 14

      # O build deixa ~14 GB em dist/<aparelho>/build (fontes + objetos). Numa
      # matriz com varios aparelhos isso enche o runner no meio do job seguinte.
      - name: Limpar arvore de build
        if: always()
        run: rm -rf dist/${{ matrix.device }}/build

  release:
    name: anexar ao release
    needs: [matrix, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          # Anexa o comprimido; `fail_on_unmatched_files: false` porque o
          # formato varia com o que existir na maquina (xz, zstd ou gzip).
          files: |
            artifacts/**/*.img.xz
            artifacts/**/*.img.zst
            artifacts/**/*.img.gz
            artifacts/**/*.sha256
          fail_on_unmatched_files: false
