##############################################################
# Giochi Konsol OS v1.2 — umtprd.conf
#
# Gerado no build (storage substituido por @GIOCHI_MTP_STORAGE@).
# Formato: chave valor, uma por linha (upstream uMTP-Responder 1.8.1).
#
# Somente leitura/escrita no diretorio do usuario. NAO exponha "/" aqui:
# o Launcher ja valida o que instala, mas MTP nao deve dar acesso a
# /etc nem a chaves.
##############################################################

# --- storage exposto ao PC --------------------------------------------
storage "@GIOCHI_MTP_STORAGE@" "Giochi" "rw"

# --- identidade -------------------------------------------------------
manufacturer "Giochi Konsol OS"
product "Giochi Konsol OS"
serial "giochi0001"
firmware_version "1.2"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"
interface "MTP"

# --- USB --------------------------------------------------------------
usb_vendor_id   0x1D6B
usb_product_id  0x0104
usb_class       0x6      # Image
usb_subclass    0x1      # Still Imaging
usb_protocol    0x1      #
usb_dev_version 0x0300
usb_max_packet_size 0x200

# --- FunctionFS -------------------------------------------------------
# 0x1 = o gadget configfs ja foi criado (por giochi-usb-mode) e o umtprd
# apenas monta o FunctionFS e responde. NAO deixe o umtprd criar o gadget:
# precisamos do mesmo config com ECM/RNDIS para o SSH via USB.
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"

# Reinicia a resposta quando o cabo e reconectado (comportamento esperado
# por Windows/macOS ao montar/desmontar o volume).
loop_on_disconnect 0
