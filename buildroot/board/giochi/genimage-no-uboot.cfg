# Giochi Konsol OS v1.2 — layout SD SEM bootloader.
#
# Usado quando o U-Boot vem do vendor/ROCKNIX (mainline nao tem defconfig para
# X55/X35S/X35H/RK3326). Grave o bootloader do vendor primeiro (offset 32 KiB)
# e depois esta imagem a partir do offset 8 MiB — ou use o script
# tools/flash-vendor-bootloader.sh como referencia.
#
# Layout (secao 1.3): p1 = boot (FAT), p2 = B1, p3 = B2, p4 = /user.
image sdcard.img {
        hdimage {
                partition-table-type = "dos"
        }

        partition boot {
                partition-type-uuid = "U"
                image = "boot.vfat"
                offset = 8M
                size = 128M
        }

        partition system-a {
                partition-type-uuid = "L"
                image = "rootfs.squashfs"
                size = 160M
        }

        partition system-b {
                partition-type-uuid = "L"
                image = "rootfs.squashfs"
                size = 160M
        }

        partition user {
                partition-type-uuid = "L"
                image = "user.ext4"
                size = 512M
        }
}
