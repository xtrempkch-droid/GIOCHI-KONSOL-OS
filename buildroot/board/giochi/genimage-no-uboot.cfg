# Giochi Konsol OS v1.2 — layout SD SEM bootloader.
#
# Usado quando o U-Boot vem do vendor/ROCKNIX (mainline nao tem defconfig para
# X35S/X35H; o RK3326 nao tem nenhum). Procedimento: grave o bootloader do
# vendor em 32 KiB e depois ESTA imagem a partir do offset 8 MiB (as duas
# primeiras particoes comecam em 8M, entao o comeco da imagem e descartavel).
#
# TAMANHOS: este arquivo e a FONTE UNICA do tamanho de cada particao (o
# post-image.sh le daqui para criar o user.ext4 e conferir os artefatos).
#
# Layout (secao 1.3): p1 = boot (FAT), p2 = B1, p3 = B2, p4 = /user.
image sdcard.img {
        hdimage {
                # MBR (dos). Em dos NAO existe 'partition-type-uuid' — o
                # genimage aborta com "part boot: 'partition-type-uuid' is
                # only valid for gpt and hybrid". Use o byte hex:
                # 0x0c = W95 FAT32 (LBA) | 0x83 = Linux.
                partition-table-type = "dos"
                # Assinatura FIXA do MBR: e ela que forma o PARTUUID do kernel
                # ("47494f43-02" = slot A). Sem ela o genimage sorteia uma a
                # cada build e o root= do boot.cmd/extlinux apontaria para o
                # disco errado. Com ela a MESMA imagem inicia do cartao (SD1 =
                # mmcblk1, SD2 = mmcblk2) e do eMMC (mmcblk0) -- sentido de
                # tools/install-image-to-emmc.sh.
                disk-signature = 0x47494f43
        }

        # 80 MiB: Image (47 MB) + dtb + boot.scr. Era 128 MiB; o mkbootimg.sh
        # monta um FAT de 64 MB e o resto era espaco morto em todo cartao.
        # Deixa 32 KiB..8 MiB para o bootloader do vendor (idbloader em 32 KiB,
        # u-boot.itb em 6 MiB) — o .itb tem de caber abaixo de 8 MiB.
        partition boot {
                partition-type = 0x0c
                image = "boot.vfat"
                offset = 8M
                size = 80M
        }

        partition system-a {
                partition-type = 0x83
                image = "rootfs.squashfs"
                size = 160M
        }

        partition system-b {
                partition-type = 0x83
                image = "rootfs.squashfs"
                size = 160M
        }

        partition user {
                partition-type = 0x83
                image = "user.ext4"
                size = 512M
        }
}
