# Giochi Konsol OS v1.2 — layout SD (secao 1.3).
# Slot 1: A (boot FAT) | B1 (SquashFS) | C (/user ext4)
# Slot 2 (opcional, exclusivo): swapfile OU user2 — criado em runtime por
# S10storage/S30swap, nunca pelo genimage.
#
# TAMANHOS: este arquivo e a FONTE UNICA do tamanho de cada particao — o
# post-image.sh le os valores daqui para criar o user.ext4 e para conferir se
# cada artefato cabe. Nao repita esses numeros em outro lugar.
#
# O que foi medido (build real da X55, ver docs/BUILD.md):
#   u-boot-rockchip.bin  8,97 MiB -> precisa de 16 MiB: o u-boot.itb embutido
#                                   comeca em 6 MiB e o arquivo termina em
#                                   ~9 MiB, portanto NAO cabe nos 8 MiB que
#                                   este arquivo declarava (o genimage aborta
#                                   com "image too big for partition");
#   boot.vfat            64 MiB   (Image 47 MB + dtb + boot.scr);
#   rootfs.squashfs      27-35 MB (orcamento da secao 8: <= 150 MB);
#   user.ext4            512 MiB  (criado vazio pelo post-image).
image sdcard.img {
        hdimage {
                partition-table-type = "dos"
                gpt-location = 1M
        }

        # Regiao raw (fora da tabela de particoes), como o rkdeveloptool espera.
        partition u-boot {
                in-partition-table = "no"
                image = "u-boot-rockchip.bin"
                offset = 32K
                size = 16M
        }

        # 80 MiB: Image + dtbs/ + extlinux/ + splash (docs/hardware-e-drivers.md §2).
        # Comeca em 24 MiB para nao encostar na regiao do U-Boot
        # (32 KiB + 16 MiB) nem no setor de backup do GPT.
        partition boot {
                partition-type-uuid = "U"
                image = "boot.vfat"
                offset = 24M
                size = 80M
        }

        partition system-a {
                partition-type-uuid = "L"
                image = "rootfs.squashfs"
                size = 160M
        }

        partition system-b {
                partition-type-uuid = "L"
                image = "rootfs.squashfs"
                size = 160M
        }

        partition user {
                partition-type-uuid = "L"
                image = "user.ext4"
                size = 512M
        }
}
