# Giochi Konsol OS v1.2 — mdev (secao 1.4 / 4.11).
# Dongles USB: ao inserir, o helper faz modprobe do modulo pelo VID:PID.
# Chipset desconhecido -> log e sistema segue sem rede.
(usb[0-9]+/.*)	root:root	660	*	/usr/sbin/giochi-dongle-hotplug
(net/wlan[0-9]+)	root:root	660	*	*
(bluetooth/hci[0-9]+)	root:root	660	*	*
(input/event[0-9]+)	root:root	660	*	*
(zram[0-9]+)	root:root	660	*	*
