# Giochi Konsol OS v1.2 — mdev (secao 1.4 / 4.11).
# Dongles USB: ao inserir, o helper faz modprobe do modulo pelo VID:PID.
# Chipset desconhecido -> log e sistema segue sem rede.

# $MODALIAS tem de casar com o modalias do KERNEL, nao com o nome do no:
# mdev preenche esta variavel quando o evento e "add" com modalias presente.
# Sem esta linha o coldplug (S05modules) cria /dev e nao carrega driver
# nenhum — foi o que deixou o DSI sem PHY (-517) e o audio sem placa na X55.
# O "@" roda o comando uma vez por evento, depois de criar o no.
$MODALIAS=.*	root:root	660	@modprobe -b $MODALIAS

(usb[0-9]+/.*)	root:root	660	*	/usr/sbin/giochi-dongle-hotplug
(net/wlan[0-9]+)	root:root	660	*	*
(bluetooth/hci[0-9]+)	root:root	660	*	*
(input/event[0-9]+)	root:root	660	*	*
(zram[0-9]+)	root:root	660	*	*
