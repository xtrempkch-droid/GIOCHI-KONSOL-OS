# Giochi Konsol OS v1.2 — DHCP da rede USB (secao 4.6 / F10).
# O console e sempre 10.55.0.1; o PC recebe 10.55.0.2..10.
start           10.55.0.2
end             10.55.0.10
interface       usb0
max_leases      9
remaining       yes
auto_time       30
decline_time    60
conflict_time   60
offer_time      20
min_lease       60
lease_file      /run/giochi/udhcpd.leases
pidfile         /run/giochi/udhcpd.pid
option subnet   255.255.255.0
option router   10.55.0.1
option dns      10.55.0.1
