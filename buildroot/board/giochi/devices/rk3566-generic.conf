# RK3566 generico (bring-up, painel 640x480).
#
# DECISAO: usa o DTS mainline da Anbernic RG353V (RK3566, 640x480) como
# referencia. Para a sua placa, passe GIOCHI_DTS_PATH=<seu.dts>.
GIOCHI_ID=rk3566-generic
GIOCHI_NAME="RK3566 (generico)"
GIOCHI_SOC=rk3566
GIOCHI_DEFCONFIG=giochi_rk3566_defconfig
GIOCHI_DTS=rk3566-anbernic-rg353v
GIOCHI_DTS_UPSTREAM=yes
GIOCHI_DTB_FILE=rk3566-anbernic-rg353v.dtb
GIOCHI_PANEL=640x480
GIOCHI_ROTATION=0
GIOCHI_LAYOUT=default
GIOCHI_BUTTONS_MAP=default
GIOCHI_JOYPAD=mainline
GIOCHI_WIFI="dongle USB"
GIOCHI_BT="dongle USB"
GIOCHI_USB_GADGET=yes
GIOCHI_TESTED=no
GIOCHI_NOTES="DTS mainline RG353V como referencia 640x480; ajuste via GIOCHI_DTS_PATH."
# U-Boot: mainline NAO tem defconfig para este aparelho (ver docs/DEVICES.md).
# Para imagem bootavel de fabrica, use o U-Boot do vendor (ROCKNIX/Rockchip)
# e aponte GIOCHI_UBOOT_DEFCONFIG / UBOOT_DIR para o tree dele.
GIOCHI_UBOOT_DEFCONFIG=quartz64-a-rk3566
GIOCHI_UBOOT_UPSTREAM=yes
GIOCHI_UBOOT_NOTES="mainline disponivel; troque pelo defconfig da sua placa"
