# Powkiddy X55 — RK3566, 2 GB. UNICO aparelho confirmado em hardware
# (docs/hardware-e-drivers.md §3). DTS mainline desde a v6.8.
GIOCHI_ID=x55
GIOCHI_NAME="Powkiddy X55"
GIOCHI_SOC=rk3566
GIOCHI_DEFCONFIG=giochi_x55_defconfig
GIOCHI_DTS=rk3566-powkiddy-x55
GIOCHI_DTS_UPSTREAM=yes
GIOCHI_DTB_FILE=rk3566-powkiddy-x55.dtb
GIOCHI_PANEL=720x1280
GIOCHI_ROTATION=270
GIOCHI_LAYOUT=x55
GIOCHI_BUTTONS_MAP=default
GIOCHI_JOYPAD=rocknix
GIOCHI_WIFI="integrated rtw88_8821cs (SDIO)"
GIOCHI_BT="integrated rtl8821cs (UART/H5)"
GIOCHI_USB_GADGET=yes
GIOCHI_TESTED=yes
GIOCHI_NOTES="Painel 720x1280 com rotation=270; Wi-Fi/BT no SoC (nao dongle)."
# U-Boot: mainline NAO tem defconfig para este aparelho (ver docs/DEVICES.md).
# Para imagem bootavel de fabrica, use o U-Boot do vendor (ROCKNIX/Rockchip)
# e aponte GIOCHI_UBOOT_DEFCONFIG / UBOOT_DIR para o tree dele.
GIOCHI_UBOOT_DEFCONFIG=powkiddy-x55-rk3566
GIOCHI_UBOOT_UPSTREAM=no
GIOCHI_UBOOT_NOTES="usar U-Boot do vendor (ROCKNIX); quartz64-a compila mas nao inicializa o painel/DDR da X55"
