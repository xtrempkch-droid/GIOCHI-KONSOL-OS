# Powkiddy X55 — RK3566, 2 GB. UNICO aparelho confirmado em hardware
# (docs/hardware-e-drivers.md §3). DTS mainline desde a v6.8.
GIOCHI_ID=x55
GIOCHI_NAME="Powkiddy X55"
GIOCHI_SOC=rk3566
GIOCHI_DEFCONFIG=giochi_x55_defconfig
GIOCHI_DTS=rk3566-powkiddy-x55
GIOCHI_DTS_UPSTREAM=yes
GIOCHI_DTB_FILE=rk3566-powkiddy-x55.dtb
GIOCHI_PANEL=720x1280
GIOCHI_ROTATION=270
GIOCHI_LAYOUT=x55
GIOCHI_BUTTONS_MAP=default
GIOCHI_JOYPAD=rocknix
GIOCHI_WIFI="integrated rtw88_8821cs (SDIO)"
GIOCHI_BT="integrated rtl8821cs (UART/H5)"
GIOCHI_USB_GADGET=yes
GIOCHI_TESTED=yes
GIOCHI_NOTES="Painel 720x1280 com rotation=270; Wi-Fi/BT no SoC (nao dongle)."
# U-Boot: mainline TEM defconfig desde a v2024.07
# (configs/powkiddy-x55-rk3566_defconfig, upstream). A imagem sai bootavel de
# fabrica; BL31 e DDR/TPL vem do rkbin (Rockchip), como nos demais RK35xx do
# Buildroot. Ver docs/DEVICES.md.
GIOCHI_UBOOT_DEFCONFIG=powkiddy-x55-rk3566
GIOCHI_UBOOT_UPSTREAM=yes
# Versao minima com o defconfig: 2024.07. Pinada em 2024.10 (LTS seguinte).
GIOCHI_UBOOT_VERSION=2024.10
# Caminhos dentro do rkbin (pinado pelo Buildroot). Existem em b4558da0.
GIOCHI_UBOOT_TPL=bin/rk35/rk3566_ddr_1056MHz_v1.18.bin
GIOCHI_UBOOT_BL31=bin/rk35/rk3568_bl31_v1.43.elf
GIOCHI_UBOOT_NOTES="mainline desde 2024.07; BL31/TPL do rkbin"
