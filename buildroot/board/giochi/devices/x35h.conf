# Powkiddy X35H — RK3566, usa o MESMO DTS/DTB da X35S (modelo reportado
# como 'Powkiddy x35s'). Sem radio integrado.
GIOCHI_ID=x35h
GIOCHI_NAME="Powkiddy X35H"
GIOCHI_SOC=rk3566
GIOCHI_DEFCONFIG=giochi_x35h_defconfig
GIOCHI_DTS=rk3566-powkiddy-x35s
GIOCHI_DTS_UPSTREAM=no
# Fallback SO PARA TESTE: DTS mainline de painel 640x480.
# Nao cobre GPIO de painel/controles desta placa (pode dar tela preta).
GIOCHI_DTS_FALLBACK=rk3566-anbernic-rg353v
GIOCHI_DTB_FILE=rk3566-powkiddy-x35s.dtb
GIOCHI_PANEL=640x480
GIOCHI_ROTATION=0
GIOCHI_LAYOUT=default
GIOCHI_BUTTONS_MAP=x35s
GIOCHI_JOYPAD=rocknix
GIOCHI_WIFI=none
GIOCHI_BT=none
GIOCHI_USB_GADGET=no
GIOCHI_TESTED=partial
GIOCHI_NOTES="Video/audio/botoes OK em 2026-10-24; sem Wi-Fi/BT; USB nao ancora."
# U-Boot: mainline NAO tem defconfig para este aparelho (ver docs/DEVICES.md).
# Para imagem bootavel de fabrica, use o U-Boot do vendor (ROCKNIX/Rockchip)
# e aponte GIOCHI_UBOOT_DEFCONFIG / UBOOT_DIR para o tree dele.
GIOCHI_UBOOT_DEFCONFIG=anbernic-rgxx3-rk3566
GIOCHI_UBOOT_UPSTREAM=no
GIOCHI_UBOOT_NOTES="idem X35S: vendor U-Boot"
