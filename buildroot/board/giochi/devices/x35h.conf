# Powkiddy X35H — RK3566, usa o MESMO DTS/DTB da X35S (modelo reportado
# como 'Powkiddy x35s'). Sem radio integrado.
GIOCHI_ID=x35h
GIOCHI_NAME="Powkiddy X35H"
GIOCHI_SOC=rk3566

# Capacidade grafica do SoC, medida no features.txt do Mesa (nao estimada):
# rk3566 = panfrost, GL desktop 3.1, GLES 3.1. O RK3326 (lima) NAO chega ao
# GL 3.0 desktop, e engine que exige mais que isso nao roda nele.
GIOCHI_GPU_DRIVER=panfrost
GIOCHI_GL_DESKTOP=3.1
GIOCHI_GLES=3.1
GIOCHI_VULKAN=no
GIOCHI_DEFCONFIG=giochi_x35h_defconfig
GIOCHI_DTS=rk3566-powkiddy-x35s
GIOCHI_DTS_UPSTREAM=no
# Fallback SO PARA TESTE: DTS mainline de painel 640x480.
# Nao cobre GPIO de painel/controles desta placa (pode dar tela preta).
GIOCHI_DTS_FALLBACK=rk3566-anbernic-rg353v
# O fallback herda o painel do rg353p (newvision,nv3051d, 640x480),
# que TEM driver mainline: plausivel para ver o kernel subir, mas nao e
# o painel real (init sequence diferente). Use tools/check-dts-panel.py
# para conferir se o DTS escolhido tem painel utilizavel.
# NOTA sobre o DTS do X35S/X35H (medido nas fontes da ROCKNIX, 2026-10-31):
# o DTS oficial (rk3566-powkiddy-x35s.dts, patch 0016 da ROCKNIX) deriva do DTS
# da X55 e troca o painel para
#   compatible = "rocknix,generic-dsi";
# que e' um driver FORA DA ARVORE do mainline (ROCKNIX
# packages/linux-drivers/generic-dsi). Sem esse driver o painel nao liga, mesmo
# com o DTS certo. O mesmo DTS tambem usa "&joypad" (rocknix-joypad), tambem
# fora da arvore. Por isso este aparelho nao entra com DTS upstream ainda.
# DECISAO (2026-10-31, mantenedor): o licenciamento do projeto sera revisto
# mais a frente, e o driver GPL-2.0 NAO entra por ora. Quando entrar, o
# trabalho e: por o fonte em src/kernel/patches/, um fragmento com
# CONFIG_DRM_PANEL_GENERIC_DSI=m e trocar GIOCHI_DTS_UPSTREAM para yes.
# Ate la, a tela deste aparelho nao acende com DTS mainline -- limitacao
# conhecida, nao defeito de boot. tools/check-dts-panel.py avisa.
GIOCHI_DTB_FILE=rk3566-powkiddy-x35s.dtb
GIOCHI_PANEL=640x480
GIOCHI_ROTATION=0
GIOCHI_LAYOUT=default
GIOCHI_BUTTONS_MAP=x35s
GIOCHI_JOYPAD=rocknix
GIOCHI_WIFI=none
GIOCHI_BT=none
GIOCHI_USB_GADGET=no
GIOCHI_TESTED=partial
GIOCHI_NOTES="Video/audio/botoes OK em 2026-10-24; sem Wi-Fi/BT; USB nao ancora."
# U-Boot: mainline NAO tem defconfig para este aparelho (ver docs/DEVICES.md).
# Para imagem bootavel de fabrica, use o U-Boot do vendor (ROCKNIX/Rockchip)
# e aponte GIOCHI_UBOOT_DEFCONFIG / UBOOT_DIR para o tree dele.
GIOCHI_UBOOT_DEFCONFIG=anbernic-rgxx3-rk3566
GIOCHI_UBOOT_UPSTREAM=no
GIOCHI_UBOOT_NOTES="idem X35S: vendor U-Boot"
