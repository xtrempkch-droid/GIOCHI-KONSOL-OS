# RK3326 generico (foco da spec: 1-2 GB, Mali-G31, Cortex-A35).
#
# DECISAO: sem DTS de fabricante no repositorio (secao 5.1), a imagem usa um
# DTS mainline com painel 640x480 — Anbernic RG351V (RK3326, 640x480, ADC
# joystick). Serve para bring-up/teste; para o seu aparelho, troque por
# GIOCHI_DTS_PATH=<seu.dts>.
GIOCHI_ID=rk3326-generic
GIOCHI_NAME="RK3326 (generico)"
GIOCHI_SOC=rk3326
GIOCHI_DEFCONFIG=giochi_rk3326_defconfig
GIOCHI_DTS=rk3326-anbernic-rg351v
GIOCHI_DTS_UPSTREAM=yes
GIOCHI_DTB_FILE=rk3326-anbernic-rg351v.dtb
GIOCHI_PANEL=640x480
GIOCHI_ROTATION=0
GIOCHI_LAYOUT=default
GIOCHI_BUTTONS_MAP=default
GIOCHI_JOYPAD=mainline
GIOCHI_WIFI="dongle USB (ADR-14)"
GIOCHI_BT="dongle USB (ADR-14)"
GIOCHI_USB_GADGET=yes
GIOCHI_TESTED=no
GIOCHI_NOTES="DTS mainline RG351V como referencia 640x480; ajuste via GIOCHI_DTS_PATH."
# U-Boot: mainline NAO tem defconfig para este aparelho (ver docs/DEVICES.md).
# Para imagem bootavel de fabrica, use o U-Boot do vendor (ROCKNIX/Rockchip)
# e aponte GIOCHI_UBOOT_DEFCONFIG / UBOOT_DIR para o tree dele.
GIOCHI_UBOOT_DEFCONFIG=
GIOCHI_UBOOT_UPSTREAM=no
GIOCHI_UBOOT_NOTES="mainline nao suporta RK3326; use U-Boot do vendor (idbloader + u-boot.itb)"
